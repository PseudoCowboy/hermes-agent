# Mythos config example. Copy to mythos/config.yaml and edit, or set env vars.
# Env vars take precedence over this file. See mythos/SETUP.md.

discord:
  bot_token: ""              # DISCORD_BOT_TOKEN
  guild_id: ""               # DISCORD_GUILD_ID
  main_channel_id: ""        # MYTHOS_MAIN_CHANNEL_ID  (the channel users post project requests in)
  project_category_id: ""    # optional Discord category to nest project channels under
  approval_keywords:
    - approve
    - approved
    - lgtm
    - ship it
    - /approve

workspaces_root: ./mythos_workspaces
state_dir: ./mythos_state
max_review_rounds: 2
use_fake_runners: false      # true = stub LLM calls (for dev / smoke tests)

# Per-role agent CLI overrides. Leave empty to use the benchmark-mandated defaults.
agents:
  main:                      # Athena -- Claude Code CLI
    command: ["claude", "--dangerously-skip-permissions", "--effort", "high", "--print"]
    env:
      ANTHROPIC_BASE_URL: http://127.0.0.1:4141
      ANTHROPIC_AUTH_TOKEN: dummy
      ANTHROPIC_MODEL: claude-opus-4.7-1m-internal
    timeout_seconds: 1200
  draft_plan:                # Prometheus -- Claude Code CLI
    command: ["claude", "--dangerously-skip-permissions", "--effort", "high", "--print"]
    env:
      ANTHROPIC_BASE_URL: http://127.0.0.1:4141
      ANTHROPIC_AUTH_TOKEN: dummy
      ANTHROPIC_MODEL: claude-opus-4.7-1m-internal
  backend:                   # Atlas -- Claude Code CLI
    command: ["claude", "--dangerously-skip-permissions", "--effort", "high", "--print"]
    env:
      ANTHROPIC_BASE_URL: http://127.0.0.1:4141
      ANTHROPIC_AUTH_TOKEN: dummy
      ANTHROPIC_MODEL: claude-opus-4.7-1m-internal
  review:                    # Argus -- Codex CLI
    command: ["codex", "exec", "-m", "gpt-5.5", "-c", "model_reasoning_effort=high", "--skip-git-repo-check"]
    env:
      OPENAI_BASE_URL: http://127.0.0.1:4141/v1
      OPENAI_API_KEY: dummy
  test:                      # Hephaestus -- Codex CLI
    command: ["codex", "exec", "-m", "gpt-5.5", "-c", "model_reasoning_effort=high", "--skip-git-repo-check"]
    env:
      OPENAI_BASE_URL: http://127.0.0.1:4141/v1
      OPENAI_API_KEY: dummy
  frontend:                  # Apollo -- Gemini CLI (uses preconfigured creds, no proxy)
    command: ["gemini", "-m", "gemini-3.1-pro-preview", "-y"]
    env: {}
